{{define "dashboard-default/terminal"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tty@{{.ServerName}} - {{.Title}}</title>
    <link rel="shortcut icon" type="image/png" href="/static/logo.svg?v20210804" />
    <link type="text/css" rel="stylesheet" href="/static/cdn/xterm@5.5.0/css/xterm.css" />
</head>
<style>
    html,
    body,
    #terminal-container {
        padding: unset;
        margin: unset;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
    }

    body {
        background-color: black;
    }

    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
        #terminal-container .xterm-screen,
        #terminal-container .xterm-screen canvas {
            pointer-events: none;
        }

        #terminal-container .xterm-viewport {
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
    }

    #file-list-iframe {
        position: absolute;
        top: 0;
        right: 0;
        width: 30%;
        height: 100%;
        border: none;
        background-color: white;
        display: none;
        z-index: 10;
    }

    #folder-button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 20;
    }

    #terminal-keys {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        flex-wrap: nowrap;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
        background: #111;
        z-index: 30;
    }

    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
        #terminal-keys {
            display: flex;
            height: 36px;
        }

        #terminal-container {
            position: fixed;
            top: 36px;
            bottom: 0;
            height: auto;
        }
    }

    #terminal-keys button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 28px;
        padding: 0 2px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f3f3f3;
        color: #111;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    #terminal-keys button.active {
        background: #2563eb;
        border-color: #1d4ed8;
        color: #fff;
    }
</style>

<body onresize="onResize()">
    <div id="terminal-container"></div>
    <iframe id="file-list-iframe" name="file-list-iframe" src=""></iframe>
    <button id="folder-button">📁</button>
    <div id="terminal-keys">
        <button type="button" id="key-ctrl">Ctrl</button>
        <button type="button" data-key="escape">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="arrowLeft">←</button>
        <button type="button" data-key="arrowUp">↑</button>
        <button type="button" data-key="arrowDown">↓</button>
        <button type="button" data-key="arrowRight">→</button>
        <button type="button" data-key="home">Home</button>
        <button type="button" data-key="end">End</button>
    </div>

    <script src="/static/cdn/xterm@5.5.0/lib/xterm.js"></script>
    <script src="/static/cdn/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="/static/cdn/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
    <script src="/static/cdn/@xterm/addon-attach@0.11.0/lib/addon-attach.js"></script>
    <script>
        let sendResizing = false;

        function doResize() {
            fitAddon.fit()

            const w = fitAddon.proposeDimensions();
            const prefix = new Int8Array([1]);
            const resizeMessage = new TextEncoder().encode(JSON.stringify({
                Rows: w.rows,
                Cols: w.cols,
            }));

            var msg = new Int8Array(prefix.length + resizeMessage.length);
            msg.set(prefix);
            msg.set(resizeMessage, prefix.length);

            socket.send(msg)
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function onResize() {
            if (sendResizing) return;
            sendResizing = true;
            try {
                await sleep(1500);
                doResize();
            } catch (error) {
                console.log('resize', error);
            } finally {
                sendResizing = false
            }
        }

        const KEY_SEQ = {
            escape: '\x1b',
            tab: '\t',
            arrowUp: '\x1b[A',
            arrowDown: '\x1b[B',
            arrowRight: '\x1b[C',
            arrowLeft: '\x1b[D',
            home: '\x1b[H',
            end: '\x1b[F',
        };
        const CTRL_KEY_SEQ = {
            arrowUp: '\x1b[1;5A',
            arrowDown: '\x1b[1;5B',
            arrowRight: '\x1b[1;5C',
            arrowLeft: '\x1b[1;5D',
            home: '\x1b[1;5H',
            end: '\x1b[1;5F',
        };

        let controlActive = false;
        let lastKeyWasIME = false;

        function setControlActive(active) {
            controlActive = active;
            const btn = document.getElementById('key-ctrl');
            btn.classList.toggle('active', active);
        }

        const term = new Terminal({
            screenKeys: true,
            useStyle: true,
            cursorBlink: true,
        });
        const socket = new WebSocket((window.location.protocol == 'https:' ? 'wss' : 'ws') + '://' + window.location.host + '/terminal/' + '{{.SessionID}}');

        const attachAddon = new AttachAddon.AttachAddon(socket);
        term.loadAddon(attachAddon);

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        term.attachCustomKeyEventHandler(function (ev) {
            if (ev.type !== 'keydown') return true;
            lastKeyWasIME = ev.keyCode === 229;
            if (lastKeyWasIME) return false;
            if (controlActive && ev.key && ev.key.length === 1) {
                const code = ev.key.toUpperCase().charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    socket.send(String.fromCharCode(code - 64));
                    setControlActive(false);
                    return false;
                }
            }
            return true;
        });

        const terminalContainer = document.getElementById('terminal-container');
        term.open(terminalContainer);

        (function () {
            const vp = terminalContainer.querySelector('.xterm-viewport');
            if (!vp) return;
            vp.addEventListener('touchstart', function (ev) { ev.stopPropagation(); }, { passive: true });
            vp.addEventListener('touchmove', function (ev) { ev.stopPropagation(); }, { passive: true });
        })();

        terminalContainer.addEventListener('input', function (ev) {
            if (!lastKeyWasIME || ev.target !== term.textarea || !ev.data) return;
            let data = ev.data;
            if (controlActive && data.length === 1) {
                const code = data.toUpperCase().charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    data = String.fromCharCode(code - 64);
                    setControlActive(false);
                }
            }
            socket.send(data);
            term.textarea.value = '';
            ev.stopImmediatePropagation();
        }, true);

        socket.onopen = () => {
            onResize()
        }

        socket.onclose = () => {
            alert('{{tr "TerminalConnectionTimeOutOrSessionEnded"}}')
            window.close()
        }

        socket.onerror = () => {
            alert('{{tr "TerminalConnectionFailed"}}')
        }

        const keyBar = document.getElementById('terminal-keys');
        keyBar.addEventListener('mousedown', function (ev) { ev.preventDefault(); });

        document.getElementById('key-ctrl').addEventListener('click', function () {
            setControlActive(!controlActive);
            term.focus();
        });

        keyBar.addEventListener('click', function (ev) {
            const btn = ev.target.closest('button[data-key]');
            if (!btn || socket.readyState !== WebSocket.OPEN) return;
            const key = btn.getAttribute('data-key');
            const withControl = controlActive;
            setControlActive(false);
            socket.send((withControl && CTRL_KEY_SEQ[key]) || KEY_SEQ[key]);
            term.focus();
        });

        // 处理文件夹按钮点击事件
        const folderButton = document.getElementById('folder-button');
        const fileListIframe = document.getElementById('file-list-iframe');
        let fileListVisible = false;

        folderButton.addEventListener('click', () => {
            if (!fileListVisible) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/file';
                form.target = 'file-list-iframe';
                const idField = document.createElement('input');
                idField.type = 'hidden';
                idField.name = 'id';
                idField.value = '{{.ServerID}}';
                form.appendChild(idField);
                const csrfMatch = document.cookie.match(new RegExp('(^| )nz-csrf=([^;]+)'));
                const csrfToken = csrfMatch ? decodeURIComponent(csrfMatch[2]) : '';
                if (csrfToken) {
                    const csrfField = document.createElement('input');
                    csrfField.type = 'hidden';
                    csrfField.name = '_csrf';
                    csrfField.value = csrfToken;
                    form.appendChild(csrfField);
                }
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
                fileListIframe.style.display = 'block';
                fileListVisible = true;
            } else {
                // 隐藏文件列表
                fileListIframe.style.display = 'none';
                fileListVisible = false;
            }
        });
    </script>
</body>

</html>
{{end}}
